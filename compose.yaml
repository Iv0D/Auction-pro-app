name: auctionpro
services:
  db:
    image: mysql:8.4
    command: ["--max-allowed-packet=64M"]
    environment:
      MYSQL_DATABASE: auctionpro
      MYSQL_USER: auctionpro
      MYSQL_PASSWORD: ${DB_PASSWORD:-auctionpro-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysql -h 127.0.0.1 -u "$$MYSQL_USER" --password="$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_WEB_PORT:-8025}:8025"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DEMO_DATA: ${DEMO_DATA:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUCTION_SHIPPING_FEE: ${AUCTION_SHIPPING_FEE:-500}
      STREAMING_BASE_URL: ${STREAMING_BASE_URL:-}
      DB_URL: jdbc:mysql://db:3306/auctionpro
      DB_USERNAME: auctionpro
      DB_PASSWORD: ${DB_PASSWORD:-auctionpro-local}
      JWT_SECRET: ${JWT_SECRET:-auctionpro-local-development-key-change-me}
      MAIL_HOST: mail
      MAIL_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-8081}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8081},http://127.0.0.1:${WEB_PORT:-8081}}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auctions HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/api/auctions"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
