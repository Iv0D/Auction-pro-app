spring.application.name=tpoDA

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auctionpro}
spring.datasource.username=${DB_USERNAME:auctionpro}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:auctionpro@example.test}

app.frontend.url=${FRONTEND_URL:http://localhost:8081}

app.demo.enabled=${DEMO_DATA:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url},http://127.0.0.1:8081}
app.streaming.base-url=${STREAMING_BASE_URL:}
app.auction.shipping-fee=${AUCTION_SHIPPING_FEE:500}
